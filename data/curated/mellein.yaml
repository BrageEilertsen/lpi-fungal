name: mellein
organism: Parastagonospora nodorum (and many fungi)
bgc: (R)-mellein synthase (PR-PKS; e.g. SnPKS19)
subclass: PR
citation: >
  Sun, Ho & Townsend 2012 JACS 134:11924; Chooi et al. 2015 AEM (PMC4272741).
  (R)-mellein = (3R)-8-hydroxy-3-methyl-3,4-dihydroisocoumarin, a pentaketide. The
  3-methyl is the starter acetate carbon (NOT C-MeT). No C-MeT domain.
program:
  starter: acetyl
  cycles:
    - { reduction: kr }
    - { reduction: keto }
    - { reduction: kr }
    - { reduction: keto }
  release: dihydroisocoumarin
scored_level: cyclized
expected_linear_smiles: "CC(O)CC(=O)CC(O)CC(=O)CC(=O)O"
expected_final_smiles: "C[C@@H]1Cc2cccc(O)c2C(=O)O1"
tier: gate
ground_truth: independent
program_confidence: high
needs_expert_review: false
notes: >
  Round-trips to (R)-mellein (PubChem CID 28516) on the constitutional graph (Phase-0
  executor is achiral; the 3R stereocentre is a Phase-2 KR-head concern).
  CONFIRMED by Brage (2026-05-25): mellein = KR at cycles 1 AND 3 (the cycle-3 second KR
  is structurally forced -- the reduced-out ring carbon is the cycle-3 beta-keto).
  6-hydroxymellein = KR at cycle 1 only (see 6_hydroxymellein.yaml). The matched pair
  (differing by one KR) is the reduction-count fidelity test. Mass balance: C10H12O6
  +2KR -> C10H16O6 -lactonize(H2O)-> C10H14O5 -aldol(H2O)-> C10H12O4 -aromatize(H2O)->
  C10H10O3.