name: mellein
organism: Parastagonospora nodorum (and many fungi)
bgc: (R)-mellein synthase (PR-PKS; e.g. SnPKS19)
subclass: PR
citation: >
  Sun, Ho & Townsend 2012 JACS 134:11924; Chooi et al. 2015 AEM (PMC4272741).
  (R)-mellein = (3R)-8-hydroxy-3-methyl-3,4-dihydroisocoumarin, a pentaketide. The
  3-methyl is the starter acetate carbon (NOT C-MeT). No C-MeT domain.
program:
  starter: acetyl
  cycles:
    - { reduction: kr }
    - { reduction: keto }
    - { reduction: kr }
    - { reduction: keto }
  release: dihydroisocoumarin
scored_level: cyclized
expected_linear_smiles: "CC(O)CC(=O)CC(O)CC(=O)CC(=O)O"
expected_final_smiles: "C[C@@H]1Cc2cccc(O)c2C(=O)O1"
tier: gate
ground_truth: independent
program_confidence: medium
needs_expert_review: true
notes: >
  Round-trips to (R)-mellein (PubChem CID 28516) on the constitutional graph (Phase-0
  executor is achiral; the 3R stereocentre is a Phase-2 KR-head concern).
  DEVIATION FROM BRAGE'S STATED PROGRAM, flagged for review (QUESTIONS.md Q2): Brage
  specified a SINGLE KR at cycle 1. Mass balance shows that program reaches
  6-hydroxymellein (C10H10O4), not (R)-mellein (C10H10O3) -- see 6_hydroxymellein.yaml.
  Reaching mellein requires a SECOND KR at cycle 3 to deoxygenate the C5-derived ring
  position (analogous to the single KR that removes orsellinic's 4-OH in 6-MSA).
  Mass balance closes only with two KRs: C10H12O6 +2KR -> C10H16O6 -lactonize(H2O)->
  C10H14O5 -aldol(H2O)-> C10H12O4 -aromatize(H2O)-> C10H10O3. Please confirm whether the
  intended synthase makes mellein (2 KR) or 6-hydroxymellein (1 KR).