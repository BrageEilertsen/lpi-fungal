name: 6-methylsalicylic acid
organism: Penicillium patulum (Penicillium griseofulvum)
bgc: 6-MSAS (MSAS / AtX)
subclass: PR
citation: >
  Dimroth et al. 1970; Parascandolo et al. 2016 (Angew. Chem.); Moriguchi et al. 6-MSAS
  is a partially-reducing PKS: one acetyl + three malonyl with a single ketoreduction.
  Per Brage: encode the single reduction as KR only (a beta-hydroxyl), NOT a programmed
  DH -- the DH is not strictly required and the dehydration en route to the ring is
  coupled to aromatization. The reduced position is why 6-MSA lacks orsellinic's 4-OH.
program:
  starter: acetyl
  cycles:
    - { reduction: keto }
    - { reduction: kr }
    - { reduction: keto }
  release: aldol_aromatic
scored_level: cyclized
expected_linear_smiles: "CC(=O)CC(O)CC(=O)CC(=O)O"
expected_final_smiles: "Cc1cccc(O)c1C(=O)O"
tier: gate
ground_truth: independent
program_confidence: high
needs_expert_review: false
notes: >
  Final = 2-hydroxy-6-methylbenzoic acid (PubChem CID 68151), independent target.
  Cycle-2 KR CONFIRMED by Brage (2026-05-25): 6-MSA = orsellinic minus one ring phenol;
  the reduced-out carbon (orsellinic's 4-OH) is the cycle-2 beta-keto. Mass balance:
  non-reduced tetraketide acid C8H10O5 -> +KR -> C8H12O5 -> aromatize (-2 H2O) -> C8H8O3.
  Aromatization expels the beta-OH (no programmed DH). Ring methyl = starter carbon,
  zero C-MeT actions.
