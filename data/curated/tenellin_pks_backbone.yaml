name: tenellin polyketide backbone (TenS PKS portion)
organism: Beauveria bassiana
bgc: TenS (PKS-NRPS hybrid) + TenC (trans-ER)
subclass: HR
citation: >
  Yang, Friedrich, ... Simpson & Cox 2019 Chem. Sci. 10:8478 (methylation & chain-length
  programming); Halo et al. 2008; RSC Adv. 2024 PMC10941261. TenS makes a dimethylated,
  partially-reduced pentaketide acyl chain, condensed with L-tyrosine by the NRPS module
  then Dieckmann-cyclized to the tetramate (pretenellin A).
program:
  starter: acetyl
  cycles:
    - { reduction: dh, c_methyl: true }  # cycle 1, diketide (+C-MeT)
    - { reduction: er, c_methyl: true }  # cycle 2, triketide (+C-MeT)
    - { reduction: dh }                  # cycle 3, tetraketide
    - { reduction: keto }                # cycle 4, pentaketide
  release: hydrolysis
scored_level: linear
expected_linear_smiles: null
expected_final_smiles: null
tier: phase2
ground_truth: pending
program_confidence: medium
needs_expert_review: true
notes: >
  NOT A PHASE-0 EXECUTOR ENTRY (Brage's correction). The isolated product pretenellin A
  requires NRPS condensation with tyrosine + Dieckmann tetramate cyclization -- entirely
  outside a PKS executor -- and the pre-NRPS acyl chain is a transient with no independent
  structure. Tenellin is a PHASE-2 TRACE-LEVEL BENCHMARK: predict pentaketide chain length
  + C-MeT at cycles 1 and 2 (HIGH confidence, well characterized). The per-cycle reduction
  vector above is a best-effort guess (MEDIUM) to be verified against pretenellin A; it is
  not scored in Phase 0. ER at cycle 2 is supplied in trans by TenC.