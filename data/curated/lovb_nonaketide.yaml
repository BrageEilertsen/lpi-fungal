name: LovB dihydromonacolin L nonaketide
organism: Aspergillus terreus
bgc: LovB (+ LovC trans-ER, LovG trans-TE); lovastatin nonaketide synthase
subclass: HR
citation: >
  Ma et al. 2009 Science 326:589; methyltransferase-programming paper PMC4906797
  (per-cycle table); Nat. Commun. 2021 PMC7870829; LovG TE PMC3844545. LovB runs eight
  elongation cycles (nonaketide) with a per-cycle-distinct reduction state and a single
  C-MeT at cycle 3; its in-cis ER is non-functional, ER supplied in trans by LovC.
program:
  starter: acetyl
  cycles:
    - { reduction: er }                 # cycle 1, diketide
    - { reduction: er }                 # cycle 2, triketide
    - { reduction: er, c_methyl: true } # cycle 3, tetraketide (+C-MeT)
    - { reduction: er }                 # cycle 4, pentaketide
    - { reduction: dh }                 # cycle 5, hexaketide
    - { reduction: er }                 # cycle 6, heptaketide
    - { reduction: kr }                 # cycle 7, octaketide
    - { reduction: kr }                 # cycle 8, nonaketide
  release: hydrolysis
scored_level: cyclized
expected_linear_smiles: null
expected_final_smiles: null
tier: hard
ground_truth: pending
program_confidence: high
needs_expert_review: false
notes: >
  RE-TIERED OUT OF THE PHASE-0 GATE (Brage's gate-scoping correction). The only isolated
  product is dihydromonacolin L, which carries a Diels-Alder decalin formed MID-assembly
  (~hexaketide stage) -- a linear-only executor cannot reach it, and there is no
  independently-isolated linear nonaketide to test against. So LovB is:
    (a) a HARD-TIER Phase-0b entry, scored at dihydromonacolin L once a Diels-Alder
        closure operator (and mid-program cyclization) exists; and
    (b) a Phase-2 trace-level benchmark for the 8-cycle program above.
  The 8-cycle program (E,E,M+Me,M,E,M,H,H; C-MeT cycle 3; ER at 3/4/6 via LovC) is taken
  from the cited programming paper and is HIGH confidence; do NOT score it in Phase 0.
  Final SMILES for dihydromonacolin L: take from PubChem when the DA operator lands.